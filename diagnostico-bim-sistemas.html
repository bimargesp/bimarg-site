<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIMARG — Diagnóstico BIM · MASTER-SISTEMAS</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --dk:#0a0a0a;--d2:#111;--ca:#181818;--cb:#222;
  --c:#00BFFF;--cd:rgba(0,191,255,.1);
  --ok:#22C55E;--okd:rgba(34,197,94,.12);
  --warn:#F59E0B;--warnd:rgba(245,158,11,.1);
  --err:#EF4444;
  --tx:rgba(255,255,255,.88);--mu:rgba(255,255,255,.45);--fa:rgba(255,255,255,.06);
  --fn:-apple-system,'Helvetica Neue',Arial,sans-serif;
}
body{font-family:var(--fn);background:var(--dk);color:var(--tx);-webkit-font-smoothing:antialiased;min-height:100vh}

/* HEADER */
.header{background:var(--d2);border-bottom:1px solid var(--fa);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-size:18px;font-weight:900;letter-spacing:-.03em;color:#fff}
.logo span{color:var(--c)}
.proj-path{font-size:11px;color:var(--mu);letter-spacing:.08em}
.proj-path b{color:var(--c);font-weight:700}
.header-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prog-global{display:flex;align-items:center;gap:10px}
.prog-bar{width:160px;height:6px;background:var(--fa);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--c);border-radius:99px;transition:width .4s}
.prog-txt{font-size:13px;font-weight:700;color:var(--c);min-width:36px;text-align:right}
.btn-reset{font-size:11px;font-weight:700;padding:6px 14px;border-radius:99px;border:1px solid var(--fa);background:transparent;color:var(--mu);cursor:pointer;letter-spacing:.06em;text-transform:uppercase;transition:border-color .2s,color .2s}
.btn-reset:hover{border-color:var(--err);color:var(--err)}
.btn-print{font-size:11px;font-weight:700;padding:6px 14px;border-radius:99px;border:1px solid var(--cb);background:var(--cb);color:var(--tx);cursor:pointer;letter-spacing:.06em;text-transform:uppercase;transition:background .2s}
.btn-print:hover{background:#2a2a2a}

/* LAYOUT */
.wrap{max-width:1200px;margin:0 auto;padding:32px 24px}

/* LEGEND */
.legend{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:32px;align-items:center}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mu)}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* SISTEMA CARD */
.sistema{background:var(--ca);border:1px solid var(--fa);border-radius:16px;margin-bottom:16px;overflow:hidden;transition:border-color .2s}
.sistema.active{border-color:var(--cb)}
.sis-header{padding:20px 24px;display:flex;align-items:center;gap:16px;cursor:pointer;user-select:none;transition:background .2s}
.sis-header:hover{background:rgba(255,255,255,.02)}
.sis-code{font-size:13px;font-weight:900;letter-spacing:.1em;color:var(--c);min-width:44px;text-transform:uppercase}
.sis-name{font-size:15px;font-weight:700;color:#fff;flex:1}
.sis-desc{font-size:12px;color:var(--mu);font-weight:400;display:block;margin-top:2px}
.sis-stats{display:flex;align-items:center;gap:12px;margin-left:auto;flex-shrink:0}
.sis-prog{display:flex;align-items:center;gap:8px}
.sis-bar{width:80px;height:4px;background:var(--fa);border-radius:99px;overflow:hidden}
.sis-fill{height:100%;border-radius:99px;transition:width .3s}
.sis-pct{font-size:12px;font-weight:700;color:var(--mu);min-width:32px;text-align:right}
.sis-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.badge-ok{background:var(--okd);color:var(--ok);border:1px solid rgba(34,197,94,.2)}
.badge-warn{background:var(--warnd);color:var(--warn);border:1px solid rgba(245,158,11,.2)}
.badge-err{background:rgba(239,68,68,.1);color:var(--err);border:1px solid rgba(239,68,68,.2)}
.badge-nd{background:var(--fa);color:var(--mu);border:1px solid rgba(255,255,255,.08)}
.sis-arrow{color:var(--mu);font-size:14px;transition:transform .3s}
.sis-header.open .sis-arrow{transform:rotate(180deg)}

/* CHECKLIST BODY */
.sis-body{display:none;border-top:1px solid var(--fa);padding:24px}
.sis-body.open{display:block}
.cat-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--mu);margin-bottom:10px;margin-top:20px;display:flex;align-items:center;gap:8px}
.cat-title:first-child{margin-top:0}
.cat-title::before{content:'';flex:1;height:1px;background:var(--fa)}
.cat-title::after{content:'';flex:1;height:1px;background:var(--fa)}
.checks{display:flex;flex-direction:column;gap:6px}
.check-item{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;border-radius:10px;cursor:pointer;transition:background .15s;border:1px solid transparent}
.check-item:hover{background:rgba(255,255,255,.03)}
.check-item.checked{background:var(--okd);border-color:rgba(34,197,94,.15)}
.check-item.na{background:rgba(255,255,255,.02);opacity:.5}
.chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--fa);background:var(--fa);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s;cursor:pointer}
.check-item.checked .chk{background:var(--ok);border-color:var(--ok)}
.chk-icon{color:#000;font-size:11px;font-weight:900;opacity:0;transition:opacity .15s}
.check-item.checked .chk-icon{opacity:1}
.chk-label{font-size:13px;color:var(--tx);line-height:1.55;flex:1}
.chk-label small{font-size:11px;color:var(--mu);display:block;margin-top:2px}
.chk-sev{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em;flex-shrink:0;margin-top:3px}
.sev-c{background:rgba(239,68,68,.12);color:#FF8888}
.sev-m{background:var(--warnd);color:var(--warn)}
.sev-b{background:var(--cd);color:var(--c)}
.btn-na-row{display:flex;justify-content:flex-end;margin-top:8px}
.btn-na{font-size:10px;padding:4px 10px;border-radius:99px;border:1px solid var(--fa);background:transparent;color:var(--mu);cursor:pointer;letter-spacing:.06em}
.btn-na:hover{border-color:var(--mu);color:var(--tx)}

/* NOTES */
.sis-notes{margin-top:20px;border-top:1px solid var(--fa);padding-top:16px}
.sis-notes label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);display:block;margin-bottom:8px}
.sis-notes textarea{width:100%;background:var(--cb);border:1px solid var(--fa);border-radius:10px;padding:12px;color:var(--tx);font-family:var(--fn);font-size:13px;line-height:1.6;resize:vertical;min-height:72px;outline:none;transition:border-color .2s}
.sis-notes textarea:focus{border-color:var(--c)}
.sis-notes textarea::placeholder{color:var(--mu)}

/* SUMMARY */
.summary{background:var(--ca);border:1px solid var(--fa);border-radius:16px;padding:28px;margin-bottom:32px}
.sum-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);margin-bottom:20px}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.sum-item{text-align:center;background:var(--d2);border-radius:12px;padding:16px 10px}
.sum-num{font-size:28px;font-weight:900;letter-spacing:-.03em;display:block;margin-bottom:4px}
.sum-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu)}

@media(max-width:700px){
  .sis-stats{display:none}
  .header{padding:14px 16px}
  .wrap{padding:20px 12px}
  .sum-grid{grid-template-columns:repeat(3,1fr)}
}
@media print{
  .header{position:static;border:none}
  .btn-reset,.btn-print,.sis-arrow{display:none}
  .sis-body{display:block!important}
  .sistema{break-inside:avoid;margin-bottom:12px}
  body{background:#fff;color:#000}
  .ca,.d2,.cb{background:#f9f9f9}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">BIM<span>ARG</span></div>
    <div class="proj-path">PLATE BIM S03 TO P15 › 01-BMO › PROJECT › MODEL › <b>MASTER-SISTEMAS</b></div>
  </div>
  <div class="header-right">
    <div class="prog-global">
      <div class="prog-bar"><div class="prog-fill" id="globalFill" style="width:0%"></div></div>
      <div class="prog-txt" id="globalPct">0%</div>
    </div>
    <button class="btn-print" onclick="window.print()">🖨 Imprimir</button>
    <button class="btn-reset" onclick="resetAll()">✕ Reset</button>
  </div>
</div>

<div class="wrap">

  <!-- SUMMARY -->
  <div class="summary">
    <div class="sum-title">Resumen del diagnóstico — 22 sistemas</div>
    <div class="sum-grid">
      <div class="sum-item"><span class="sum-num" id="sTot" style="color:var(--c)">0</span><span class="sum-lbl">Checks OK</span></div>
      <div class="sum-item"><span class="sum-num" id="sTotAll" style="color:var(--mu)">0</span><span class="sum-lbl">Total checks</span></div>
      <div class="sum-item"><span class="sum-num" id="sSisOk" style="color:var(--ok)">0</span><span class="sum-lbl">Sistemas ≥80%</span></div>
      <div class="sum-item"><span class="sum-num" id="sSisWarn" style="color:var(--warn)">0</span><span class="sum-lbl">Sistemas 40–79%</span></div>
      <div class="sum-item"><span class="sum-num" id="sSisErr" style="color:var(--err)">0</span><span class="sum-lbl">Sistemas &lt;40%</span></div>
      <div class="sum-item"><span class="sum-num" id="sSisNd" style="color:var(--mu)">0</span><span class="sum-lbl">Sin iniciar</span></div>
    </div>
  </div>

  <div class="legend">
    <span style="font-size:11px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.1em">Criticidad:</span>
    <span class="legend-item"><span class="legend-dot" style="background:#FF8888"></span>Crítico</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--warn)"></span>Medio</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--c)"></span>Bajo</span>
  </div>

  <div id="sistemas"></div>
</div>

const savedData = JSON.parse(localStorage.getItem('bimarg_dx') || '{}');
const container = document.getElementById('sistemas');

SISTEMAS.forEach((s,si) => {
  const checkItems = s.checks.filter(c=>c.t);
  const total = checkItems.length;
  const savedChecks = savedData[s.code]?.checks || {};
  const savedNote = savedData[s.code]?.note || '';

  const el = document.createElement('div');
  el.className='sistema';
  el.id='sis_'+s.code;

  let bodyHtml='<div class="sis-body" id="body_'+s.code+'">';
  let currentCat='';
  s.checks.forEach((item,i)=>{
    if(item.cat){
      if(currentCat) bodyHtml+='</div>';
      bodyHtml+=`<div class="cat-title">${item.cat}</div><div class="checks">`;
      currentCat=item.cat;
    } else {
      const id=s.code+'_'+i;
      const isChecked=savedChecks[id]||false;
      const sevLabel={c:'Crítico',m:'Medio',b:'Bajo'}[item.sev];
      const sevClass={c:'sev-c',m:'sev-m',b:'sev-b'}[item.sev];
      bodyHtml+=`<div class="check-item${isChecked?' checked':''}" id="ci_${id}" onclick="toggle('${id}','${s.code}')">
        <div class="chk"><span class="chk-icon">✓</span></div>
        <span class="chk-label">${item.t}</span>
        <span class="chk-sev ${sevClass}">${sevLabel}</span>
      </div>`;
    }
  });
  if(currentCat) bodyHtml+='</div>';
  bodyHtml+=`<div class="sis-notes"><label>Observaciones / Notas del diagnóstico</label>
    <textarea id="note_${s.code}" placeholder="Ej: Modelo incompleto en pisos 3-5, falta coordinar con EST..." onchange="saveNote('${s.code}')">${savedNote}</textarea>
  </div></div>`;

  const done = Object.values(savedChecks).filter(Boolean).length;
  const pct = total>0?Math.round(done/total*100):0;
  const {cls:badgeClass,txt:badgeTxt} = getBadge(pct,done,total);

  el.innerHTML=`
    <div class="sis-header" id="hdr_${s.code}" onclick="toggleSis('${s.code}')">
      <span class="sis-code">${s.code}</span>
      <div><span class="sis-name">${s.name}</span><small class="sis-desc">${s.desc}</small></div>
      <div class="sis-stats">
        <div class="sis-prog">
          <div class="sis-bar"><div class="sis-fill" id="fill_${s.code}" style="width:${pct}%;background:${getFillColor(pct)}"></div></div>
          <span class="sis-pct" id="pct_${s.code}">${pct}%</span>
        </div>
        <span class="sis-badge ${badgeClass}" id="badge_${s.code}">${badgeTxt}</span>
      </div>
      <span class="sis-arrow">▼</span>
    </div>
    ${bodyHtml}`;
  container.appendChild(el);
});

updateGlobal();

function getBadge(pct,done,total){
  if(done===0) return {cls:'badge-nd',txt:'Sin iniciar'};
  if(pct>=80) return {cls:'badge-ok',txt:'OK'};
  if(pct>=40) return {cls:'badge-warn',txt:'En proceso'};
  return {cls:'badge-err',txt:'Incompleto'};
}
function getFillColor(pct){
  if(pct>=80) return 'var(--ok)';
  if(pct>=40) return 'var(--warn)';
  if(pct>0) return 'var(--err)';
  return 'var(--fa)';
}

function toggleSis(code){
  const body=document.getElementById('body_'+code);
  const hdr=document.getElementById('hdr_'+code);
  const open=body.classList.contains('open');
  body.classList.toggle('open',!open);
  hdr.classList.toggle('open',!open);
  document.getElementById('sis_'+code).classList.toggle('active',!open);
}

function toggle(id,code){
  const ci=document.getElementById('ci_'+id);
  const isChecked=ci.classList.contains('checked');
  ci.classList.toggle('checked',!isChecked);
  save(code);
  updateSisProgress(code);
  updateGlobal();
}

function save(code){
  const checks={};
  const s=SISTEMAS.find(x=>x.code===code);
  s.checks.filter(c=>c.t).forEach((item,i)=>{
    const id=code+'_'+(s.checks.indexOf(item));
    const el=document.getElementById('ci_'+id);
    if(el) checks[id]=el.classList.contains('checked');
  });
  if(!savedData[code]) savedData[code]={};
  savedData[code].checks=checks;
  localStorage.setItem('bimarg_dx',JSON.stringify(savedData));
}

function saveNote(code){
  const val=document.getElementById('note_'+code).value;
  if(!savedData[code]) savedData[code]={};
  savedData[code].note=val;
  localStorage.setItem('bimarg_dx',JSON.stringify(savedData));
}

function updateSisProgress(code){
  const s=SISTEMAS.find(x=>x.code===code);
  const checkItems=s.checks.filter(c=>c.t);
  const total=checkItems.length;
  let done=0;
  checkItems.forEach((item,i)=>{
    const id=code+'_'+(s.checks.indexOf(item));
    const el=document.getElementById('ci_'+id);
    if(el&&el.classList.contains('checked')) done++;
  });
  const pct=total>0?Math.round(done/total*100):0;
  document.getElementById('fill_'+code).style.width=pct+'%';
  document.getElementById('fill_'+code).style.background=getFillColor(pct);
  document.getElementById('pct_'+code).textContent=pct+'%';
  const b=document.getElementById('badge_'+code);
  const {cls,txt}=getBadge(pct,done,total);
  b.className='sis-badge '+cls;
  b.textContent=txt;
}

function updateGlobal(){
  let totalChecks=0,doneChecks=0;
  let sisOk=0,sisWarn=0,sisErr=0,sisNd=0;
  SISTEMAS.forEach(s=>{
    const items=s.checks.filter(c=>c.t);
    totalChecks+=items.length;
    let done=0;
    items.forEach((item,i)=>{
      const id=s.code+'_'+(s.checks.indexOf(item));
      const el=document.getElementById('ci_'+id);
      if(el&&el.classList.contains('checked')) done++;
    });
    doneChecks+=done;
    const pct=items.length>0?Math.round(done/items.length*100):0;
    if(done===0) sisNd++;
    else if(pct>=80) sisOk++;
    else if(pct>=40) sisWarn++;
    else sisErr++;
  });
  const gPct=totalChecks>0?Math.round(doneChecks/totalChecks*100):0;
  document.getElementById('globalFill').style.width=gPct+'%';
  document.getElementById('globalPct').textContent=gPct+'%';
  document.getElementById('sTot').textContent=doneChecks;
  document.getElementById('sTotAll').textContent=totalChecks;
  document.getElementById('sSisOk').textContent=sisOk;
  document.getElementById('sSisWarn').textContent=sisWarn;
  document.getElementById('sSisErr').textContent=sisErr;
  document.getElementById('sSisNd').textContent=sisNd;
}

function resetAll(){
  if(!confirm('¿Resetear todo el diagnóstico? Se perderán todos los checks y notas.')) return;
  localStorage.removeItem('bimarg_dx');
  location.reload();
}
</script>
